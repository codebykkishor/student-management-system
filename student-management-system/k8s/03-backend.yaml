# FastAPI backend: Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: student-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: student-backend:k8s
          imagePullPolicy: Never      # use the image built locally with "docker build"
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: student-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: student-secrets
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
# Nginx in the frontend forwards /api/* to "backend:8000", so this name must stay "backend"
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: student-management
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
